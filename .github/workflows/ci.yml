name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r deployer/requirements.txt
      - name: Run deploy pipeline dry-run
        run: python deployer/dry_run_test.py
