services:
  gameserver:
    build: ./gameserver
    container_name: ${GAMESERVER_CONTAINER:-bl-coop-gameserver}
    restart: unless-stopped
    # Keep stdin open so the deployer can send console commands (/console in
    # Discord) to the server process.
    stdin_open: true
    # Host networking instead of published ports: behind Docker's NAT the server
    # binds/advertises the container's internal IP, which breaks direct UDP
    # connects and Steam query. Linux hosts only (not Docker Desktop macOS/Windows).
    # Needs ports 4200-4201 and 7210 (TCP+UDP) open in the host firewall.
    network_mode: host
    environment:
      - USE_XVFB=${USE_XVFB:-0}
      # Persistent data root hint for coop server builds that honor it. The
      # current Console Server build ignores this and writes to Documents inside
      # the wine prefix instead; the entrypoint symlinks that folder to
      # /data/server-data, so data ends up there either way.
      - BANNERLORD_USER_DIR=Z:\data\server-data
    volumes:
      - ./data:/data

  deployer:
    build: ./deployer
    container_name: ${COMPOSE_PROJECT_NAME:-bl-coop}-deployer
    restart: unless-stopped
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    volumes:
      - ./data:/data
      - ./deployer/config.json:/app/config.json:ro
    # Docker access comes from an overlay:
    #   -f docker-compose.socket-proxy.yml  (recommended)
    #   -f docker-compose.raw-socket.yml    (trusted hosts only)
